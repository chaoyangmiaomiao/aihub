spring:
  application:
    name: SpringAI
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: deepseek-r1:7b
        options:
          temperature: 0.8
    openai:
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: qwen-max-latest
  datasource:
    url: jdbc:mysql://localhost:3306/springai?characterEncoding=utf-8&serverTimezone=GMT%2B8
    username: root
    password: 123456
  mybatis:
    mapperLocations: mapper/*.xml
    type-aliases-package: spring.ai.entity
    configLocation: classpath:mybatis-config.xml
  data:
    redis:
      host: 192.168.222.128
      port: 6379
      password: 123456
      database: 1
      lettuce:
        pool:
          max-idle: 16
          max-active: 32
          min-idle: 8